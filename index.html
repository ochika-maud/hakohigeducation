/* Version 2 — visible battle feedback and lively logs */
.battle-result-anchor{scroll-margin-top:95px}
.fight-panel{border:2px solid #6980ae;overflow:hidden;position:relative;background:linear-gradient(135deg,#202c47,#16213a)}
.fight-panel.battle-victory{border-color:#72e3b5;box-shadow:0 0 35px rgba(70,231,167,.12)}
.fight-panel.battle-defeat{border-color:#d8839e}
.battle-headline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:4px 0 18px}
.battle-live{border-radius:999px;background:#354260;color:#c9d7f6;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap}
.battle-live.running{background:#613e30;color:#ffbc89;animation:livePulse 1.4s ease-in-out infinite}
.battle-live.complete{background:#224d3d;color:#b2efd4;animation:none}
.battle-display-title{font-size:clamp(21px,3vw,31px);font-weight:950;letter-spacing:-.05em}
.battle-progress{color:#b1c6e3;background:#19233a;border:1px solid #344461;border-radius:8px;padding:8px 11px;font-size:12px;font-weight:850;letter-spacing:.04em}
.arena-animated{min-height:265px;position:relative;border:1px solid #405372;background:radial-gradient(ellipse 55% 85% at 50% 90%,#334465 0%,#11192d 85%)}
.arena-animated:before{content:"";position:absolute;width:75%;height:1px;background:linear-gradient(to right,transparent,#6582a355,transparent);bottom:23px;left:12.5%}
.arena-animated .fighter{position:relative;justify-content:center;z-index:1}
.fighter-motion{position:relative;will-change:transform;display:grid;place-items:center}
.fighter-strike{animation:attackSwoop .32s cubic-bezier(.15,.7,.3,1)}
.fighter-hit{animation:damageShake .35s ease-out}
.floating-damage{position:absolute;top:9px;right:4%;pointer-events:none;font-size:29px;font-weight:1000;text-shadow:0 3px 9px #090e21;animation:damageFloat .55s ease-out both;z-index:4}
.player-hit-num{color:#ffcf79}.enemy-hit-num{color:#ff8e97}
.versus-animated{font-size:clamp(20px,3vw,32px);text-shadow:0 0 18px #dc7e6444}
.versus-animated span{max-width:110px;margin-left:auto;margin-right:auto;line-height:1.4;word-break:normal}
.battle-announcer{background:#2e3b55;border:1px solid #526688;text-align:center;padding:14px 17px;margin:14px 0;border-radius:12px;font-size:clamp(14px,2.4vw,19px);font-weight:950;color:#ffe0ae;min-height:55px}
.battle-log-panel{border-radius:14px;border:1px solid #354461;background:#111a2e;overflow:hidden;margin-top:12px}
.battle-log-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid #34435f}
.battle-log-heading strong{font-size:15px}.battle-log-heading span{font-size:11px;color:#91a3c2}
.battle-log-items{display:flex;flex-direction:column;gap:6px;padding:12px;min-height:70px;max-height:306px;overflow:auto}
.battle-log-item{display:grid;grid-template-columns:67px minmax(120px,1fr) auto 90px;align-items:center;gap:8px;border-radius:8px;padding:9px 10px;background:#1e2c45;border-left:3px solid #5bbee4;font-size:12px}
.battle-log-item.log-enemy{border-left-color:#e99b83;background:#32293b}
.battle-log-item.log-new{animation:logArrive .32s ease-out;background:#34475d}
.battle-log-item.log-enemy.log-new{background:#4c3443}
.log-turn{font-size:10px;color:#a0b1cd;font-weight:850;white-space:nowrap}.log-action{font-weight:750;min-width:0}.log-damage{color:#ffe0a5;white-space:nowrap;font-size:13px}.log-hp{color:#aebedd;white-space:nowrap;font-size:11px;text-align:right}
.log-placeholder{display:grid;place-items:center;color:#b3c7e2;min-height:62px;font-size:13px}
.battle-end-summary{margin-top:14px;background:#233c43;border:1px solid #43736a}
.battle-bottom-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding-top:15px}
.batch-panel{border:2px solid #76d0b2;background:radial-gradient(ellipse at top right,#234b50 0%,#17283f 60%,#151c31 100%);overflow:hidden;position:relative}
.batch-panel:before{content:'✦ ✧ ✦';position:absolute;top:28px;right:30px;letter-spacing:16px;color:#ffe6a5;font-size:25px;opacity:.5}
.batch-kicker{color:#a3f0d2;font-size:12px;letter-spacing:.15em;font-weight:950}
.batch-title{margin-top:8px;font-size:clamp(30px,4.5vw,44px);font-weight:950;letter-spacing:-.05em;color:#fff}
.batch-summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.batch-score{background:#1f334a;border:1px solid #4b6e81;border-radius:14px;padding:17px;display:flex;gap:6px;flex-direction:column}
.batch-score span{font-size:13px;color:#c5d6ed;font-weight:750}.batch-score strong{font-size:clamp(22px,3vw,38px);font-weight:950;font-variant-numeric:tabular-nums}
.batch-score.score-win strong{color:#a2f0ce}.batch-score.score-loss strong{color:#ffad9f}
.batch-ratio{height:17px;background:#8b5362;border-radius:999px;overflow:hidden;margin-top:22px}
.batch-ratio>div{height:100%;background:linear-gradient(90deg,#49b590,#96e5ad);transition:width .5s}
.batch-viz-labels{display:flex;justify-content:space-between;margin:6px 3px 16px;font-size:12px;letter-spacing:.06em;color:#b8c9dc;font-weight:900}
.batch-medals{display:flex;flex-wrap:wrap;gap:5px;max-width:100%;margin-bottom:17px}
.batch-medal{width:25px;height:25px;border-radius:6px;display:grid;place-items:center;font-weight:900;font-size:15px}
.batch-medal.won{background:#235744;color:#b7f1c2;border:1px solid #3b9471}
.batch-medal.lost{background:#50323e;color:#e6a2b4;border:1px solid #845768}
.batch-narrative{font-size:14px;line-height:1.8;color:#d7e7f4;background:#182b42;padding:12px 14px;border-radius:9px}
.editor-mode-toggle{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 -9px}
.editor-name-row{display:flex;flex-wrap:wrap;align-items:end;gap:12px;margin-bottom:17px}
.editor-name-row label{font-size:12px;color:#afc0d8;display:flex;flex-direction:column;gap:5px}
.editor-name-row input,.new-entry-fields input{background:#121d31;color:#f1f8ff;border:1px solid #4b6080;border-radius:8px;padding:11px 13px;min-width:0}
.editor-name-row input{width:230px;max-width:100%}
.new-entry-panel{margin-top:24px;border:1px dashed #6d85aa;background:#1d2d46;border-radius:13px;padding:18px}
.new-entry-panel h3{font-size:18px;color:#ffe0ac}
.new-entry-panel p{font-size:12px;color:#b8c9e0;line-height:1.8;margin:8px 0 14px}
.new-entry-fields{display:flex;flex-wrap:wrap;gap:10px}
.new-entry-fields input{flex:1;min-width:145px}
.enemy-editor-table{min-width:890px}.enemy-editor-table td:nth-child(5) input{width:220px}.enemy-editor-table td:nth-child(6) input{width:75px}
@keyframes attackSwoop{0%{transform:translateX(0) scale(1)}35%{transform:translateX(17px) scale(1.12)}100%{transform:translateX(0) scale(1)}}
@keyframes damageShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}65%{transform:translateX(-4px)}}
@keyframes damageFloat{0%{opacity:0;transform:translateY(14px) scale(.7)}30%{opacity:1;transform:translateY(-4px) scale(1.15)}100%{opacity:0;transform:translateY(-35px) scale(1)}}
@keyframes logArrive{0%{opacity:0;transform:translateY(-9px)}100%{opacity:1;transform:translateY(0)}}
@keyframes livePulse{50%{box-shadow:0 0 13px #ffb68955}}
@media(max-width:650px){.battle-headline{gap:7px}.battle-display-title{width:100%;order:-1}.battle-progress{font-size:11px}.battle-log-item{grid-template-columns:52px minmax(0,1fr) auto;gap:6px;font-size:11px}.log-hp{display:none}.log-turn{font-size:9px}.batch-summary-grid{gap:6px}.batch-score{padding:10px}.batch-score span{font-size:11px}.batch-medal{width:22px;height:22px}.new-entry-fields .btn{width:100%}}
@media(prefers-reduced-motion:reduce){.fighter-strike,.fighter-hit,.floating-damage,.battle-log-item.log-new,.battle-live.running{animation:none!important}}
.battle-log-heading .log-toggle{background:#283f60;color:#a8d7f7;border:1px solid #49678c;border-radius:6px;padding:6px 9px;font-size:11px;font-weight:800}
.battle-log-heading .log-toggle:hover{background:#365775}
.batch-medal-guide{font-size:11px;color:#c9d9ec;line-height:1.6;margin-bottom:8px}
button.batch-medal{cursor:pointer;transition:transform .13s}
button.batch-medal:hover{transform:translateY(-3px);filter:brightness(1.2)}
button.batch-medal:focus-visible{outline:2px solid #fff;outline-offset:2px}
.import-merge-option{background:#18283d;border:1px solid #435a7a;border-radius:10px;padding:12px 14px;margin-bottom:-11px;line-height:1.65}

/* Version 3 — six-statistic advanced character editor */
.editor-submode-toggle{margin:16px 0 16px;max-width:100%;flex-wrap:wrap}
.editor-submode-toggle button.active{background:#f3af7f;color:#1a253b}
.sample-editor{min-width:0}
.advanced-editor{background:linear-gradient(145deg,#182942,#151e35);border:1px solid #617293;border-radius:16px;padding:22px;margin-bottom:8px}
.advanced-intro{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.advanced-kicker{font-size:11px;font-weight:900;letter-spacing:.14em;color:#ffbd88;margin-bottom:7px}
.advanced-intro h3{font-size:21px;line-height:1.4;color:#fff}
.advanced-intro p{font-size:12px;color:#bbcce2;max-width:720px;line-height:1.85;margin-top:8px}
.advanced-count-chip{border:1px solid #6583a2;border-radius:13px;padding:10px 15px;color:#cfe9ff;font-size:14px;font-weight:900;white-space:nowrap;background:#223b52}
.advanced-count-chip small{display:block;color:#9fb9d4;font-size:10px;margin-top:3px}
.advanced-editor-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.advanced-ability-card{border:1px solid #435574;background:#1b2941;border-radius:14px;padding:18px;min-width:0}
.advanced-card-head{display:flex;gap:12px;align-items:center;border-bottom:1px solid #40506d;padding-bottom:14px;margin-bottom:15px}
.advanced-ability-icon{display:grid;place-items:center;background:#354967;color:#ffcf9a;border-radius:10px;font-size:24px;width:42px;height:42px}
.advanced-card-head h4{font-size:17px;color:#fff}
.advanced-card-head p{font-size:11px;color:#9daecc;margin-top:4px}
.advanced-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 9px}
.advanced-field{min-width:0;display:flex;flex-direction:column;gap:6px;color:#bed2e9;font-size:11px;font-weight:800}
.advanced-field input{min-width:0;width:100%;padding:11px 8px;text-align:center;color:#fff;background:#0f1b30;border:1px solid #4f6888;border-radius:9px;font-size:18px;font-weight:850;font-variant-numeric:tabular-nums}
.advanced-field input:focus{outline:2px solid #f1b383;outline-offset:1px}
.advanced-preview{margin-top:17px;border:1px solid #39655e;background:#182f39;border-radius:10px;padding:12px}
.advanced-preview-heading{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.advanced-preview-heading strong{font-size:12px;color:#8ce4bf}.advanced-preview-heading span{font-size:11px;color:#abc2d2}
.probability-bars{height:116px;display:flex;align-items:end;justify-content:center;gap:3px;padding:2px 0 4px;border-bottom:1px solid #436470;overflow:hidden}
.probability-col{min-width:0;flex:1;max-width:36px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.probability-bar{display:block;background:linear-gradient(180deg,#ffcf91,#7fc1d6);width:85%;border-radius:4px 4px 0 0;min-height:6px}
.probability-col small{font-size:10px;color:#d7e6f8;font-variant-numeric:tabular-nums}
.advanced-values{margin-top:12px;color:#d1dfef;font-size:11px;line-height:1.9;overflow-wrap:anywhere}
.advanced-preview-tip{margin-top:7px;color:#a7bacb;font-size:11px}
.advanced-warning{background:#422e35;border:1px solid #a36c78;border-radius:10px;padding:12px;margin-top:16px;font-size:12px;line-height:1.85;color:#ffd5cf}
.advanced-footnote{font-size:12px;line-height:1.9;margin-top:19px;padding:13px 15px;border-radius:10px;background:#101d32;color:#b1c8df}
.advanced-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
.advanced-actions .btn{min-height:44px}
@media(max-width:950px){.advanced-editor-grid{grid-template-columns:1fr}.advanced-ability-card{max-width:100%}}
@media(max-width:650px){.advanced-editor{padding:12px}.advanced-ability-card{padding:12px}.advanced-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.advanced-actions .btn{width:100%}.advanced-ability-card{min-width:0}}

/* Version 5 — classroom mission picker and data-frequency reveal */
.mission-panel{background:linear-gradient(120deg,#1e2c43,#17223a);border-color:#3f5476}
.mission-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:5px 0 16px}
.mission-button{border:1px solid #536886;border-radius:10px;padding:13px 12px;background:#18263e;color:#d3e5f9;font-weight:850;font-size:13px;text-align:center;min-width:0}
.mission-button.active{border-color:#f9bd86;color:#fff4e3;background:#513d39;box-shadow:inset 0 0 0 1px #f9bd86}
.mission-button:hover{filter:brightness(1.15)}
.mission-current{border-left:4px solid #e5aa7e;background:#101c32;border-radius:8px;padding:12px 15px}
.mission-current strong{color:#f9d5b2;font-size:15px}.mission-current p{color:#c0d2e6;font-size:13px;line-height:1.75;margin-top:5px}
.frequency-reveal{margin-top:20px;padding:16px;border:1px dashed #557496;border-radius:12px;background:#182841}
.frequency-reveal>.btn{width:100%}.frequency-table-area{margin-top:14px}.frequency-table-area>p{margin-bottom:12px;line-height:1.7}
.frequency-table{min-width:420px}.frequency-table th,.frequency-table td{text-align:center}
.frequency-table td:first-child{font-weight:850;color:#e2bd91}
@media(max-width:650px){.mission-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mission-button{font-size:11px;padding:11px 8px}}

/* Ver.6: clearer statistical comparisons and mobile-friendly chart scale. */
.boxplot-zoom-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.boxplot-zoom-title{font-size:12px;color:#bacce7;font-weight:850;margin-right:4px}
.boxplot-zoom-button{border:1px solid #4d607e;border-radius:9px;padding:10px 14px;background:#1b2841;color:#cdddf3;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.boxplot-zoom-button:hover{border-color:#95c7ea;background:#263959}
.boxplot-zoom-button.active{background:#a6d1f0;color:#14233b;border-color:#a6d1f0}
.boxplot-zoom-button:focus-visible{outline:3px solid #e8ba82;outline-offset:3px}
.boxplot-wrap{margin:12px 0 8px;padding:17px 15px 12px}
.boxplot-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}
.boxplot-svg{display:block;width:100%;height:auto;min-width:635px}
.boxplot-axis-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12px;color:#b8c9e3;margin:12px 5px 0;font-variant-numeric:tabular-nums}
.boxplot-axis-footer strong{color:#fff;font-size:14px}
.boxplot-scale-note{font-size:11px;line-height:1.7;color:#e7c797;margin:9px 5px 2px}
@media(max-width:740px){.boxplot-zoom-button{flex:1 1 auto;text-align:center;padding:11px 10px}.boxplot-wrap{padding:12px 10px 10px}.boxplot-svg{min-width:665px}.boxplot-scroll{border-bottom:1px solid #32415f;padding-bottom:4px}}
